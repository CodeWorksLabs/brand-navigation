enabled:
  type: bool
  default: true

outlet:
  type: enum
  default: above-site-header
  choices:
    - above-site-header
    - below-site-header

show_brand:
  type: bool
  default: true

brand_name:
  type: string
  default: "Brand Navigation"

brand_url:
  type: string
  default: "/"

brand_logo:
  type: upload
  default: ""

brand_logo_dark:
  type: upload
  default: ""

brand_presentation:
  type: enum
  default: logo_and_name
  choices:
    - logo_and_name
    - logo_only
    - name_only

brand_target:
  type: enum
  default: _self
  choices:
    - _self
    - _blank

mobile_mode:
  type: enum
  default: menu
  choices:
    - menu
    - bar
    - hidden

navigation_items:
  type: objects
  default:
    - label: "Community"
      url: "/latest"
      title: "Browse the latest community discussions"
      icon: "comments"
      target: "_self"
      visibility: "everyone"
    - label: "Resources"
      title: "Community resources"
      icon: "book-open"
      target: "_self"
      visibility: "everyone"
      children:
        - label: "About"
          url: "/about"
          title: "Learn about this community"
          icon: "circle-info"
          target: "_self"
          visibility: "everyone"
        - label: "Discourse Meta"
          url: "https://meta.discourse.org/"
          title: "Visit the Discourse community"
          icon: "globe"
          target: "_blank"
          visibility: "everyone"
    - label: "Sign Up"
      url: "/signup"
      title: "Create an account"
      icon: "user-plus"
      target: "_self"
      visibility: "anonymous"
    - label: "My Preferences"
      url: "/my/preferences"
      title: "Manage your account preferences"
      icon: "user-gear"
      target: "_self"
      visibility: "authenticated"
  schema:
    name: navigation_item
    identifier: label
    properties:
      label:
        type: string
        required: true
        validations:
          min_length: 1
          max_length: 100
      url:
        type: string
        validations:
          max_length: 2048
          url: true
      title:
        type: string
        validations:
          max_length: 200
      icon:
        type: string
        validations:
          max_length: 100
      target:
        type: enum
        default: _self
        choices:
          - _self
          - _blank
      visibility:
        type: enum
        default: everyone
        choices:
          - everyone
          - anonymous
          - authenticated
      children:
        type: objects
        schema:
          name: navigation_child
          identifier: label
          properties:
            label:
              type: string
              required: true
              validations:
                min_length: 1
                max_length: 100
            url:
              type: string
              required: true
              validations:
                min_length: 1
                max_length: 2048
                url: true
            title:
              type: string
              validations:
                max_length: 200
            icon:
              type: string
              validations:
                max_length: 100
            target:
              type: enum
              default: _self
              choices:
                - _self
                - _blank
            visibility:
              type: enum
              default: everyone
              choices:
                - everyone
                - anonymous
                - authenticated

custom_font_awesome_icons:
  type: list
  list_type: simple
  default: "comments|book-open|circle-info|globe|user-plus|user-gear"
