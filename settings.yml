enabled:
  type: bool
  default: false

outlet:
  type: enum
  default: above-site-header
  choices:
    - above-site-header
    - below-site-header

show_brand:
  type: bool
  default: true

brand_name:
  type: string
  default: "Brand Navigation"
  max: 100

brand_url:
  type: string
  default: "/"
  max: 2048

brand_logo:
  type: upload
  default: ""

brand_logo_dark:
  type: upload
  default: ""

brand_presentation:
  type: enum
  default: logo_and_name
  choices:
    - logo_and_name
    - logo_only
    - name_only

brand_target:
  type: enum
  default: _self
  choices:
    - _self
    - _blank

mobile_mode:
  type: enum
  default: menu
  choices:
    - menu
    - bar
    - hidden

bar_background_color:
  type: string
  default: ""
  max: 7

bar_text_color:
  type: string
  default: ""
  max: 7

hover_background_color:
  type: string
  default: ""
  max: 7

submenu_background_color:
  type: string
  default: ""
  max: 7

submenu_text_color:
  type: string
  default: ""
  max: 7

navigation_items:
  type: objects
  default:
    - label: "Community"
      url: "/latest"
      title: "Browse the latest community discussions"
      icon: "comments"
      section: "left"
      target: "_self"
      visibility: "everyone"
    - label: "Resources"
      url: "/about"
      title: "Community resources"
      icon: "book-open"
      section: "left"
      target: "_self"
      visibility: "everyone"
      children:
        - label: "About"
          url: "/about"
          title: "Learn about this community"
          icon: "circle-info"
          target: "_self"
          visibility: "everyone"
        - label: "Discourse Meta"
          url: "https://meta.discourse.org/"
          title: "Visit the Discourse community"
          icon: "globe"
          target: "_blank"
          visibility: "everyone"
    - label: "Sign Up"
      url: "/signup"
      title: "Create an account"
      icon: "user-plus"
      section: "right"
      target: "_self"
      visibility: "anonymous"
    - label: "My Preferences"
      url: "/my/preferences"
      title: "Manage your account preferences"
      icon: "user-gear"
      section: "right"
      target: "_self"
      visibility: "authenticated"
  schema:
    name: brand_navigation_item_v1
    identifier: label
    properties:
      label:
        type: string
        required: true
        validations:
          min_length: 1
          max_length: 100
      url:
        type: string
        validations:
          max_length: 2048
          url: true
      link_mode:
        type: enum
        default: link
        choices:
          - link
          - group
        description: Use the label as a live link or as a submenu grouping control. Group mode keeps the saved URL but does not render it.
      title:
        type: string
        validations:
          max_length: 200
      icon:
        type: string
        validations:
          max_length: 100
      presentation:
        type: enum
        default: icon_and_label
        choices:
          - icon_and_label
          - label_only
          - icon_only
      section:
        type: enum
        default: left
        choices:
          - left
          - right
      surface:
        type: enum
        default: bar
        choices:
          - bar
          - site_header
      device_visibility:
        type: enum
        default: both
        choices:
          - both
          - desktop
          - mobile
      target:
        type: enum
        default: _self
        choices:
          - _self
          - _blank
      visibility:
        type: enum
        default: everyone
        choices:
          - everyone
          - anonymous
          - authenticated
      children:
        type: objects
        schema:
          name: brand_navigation_child_v1
          identifier: label
          properties:
            label:
              type: string
              required: true
              validations:
                min_length: 1
                max_length: 100
            url:
              type: string
              required: true
              validations:
                min_length: 1
                max_length: 2048
                url: true
            title:
              type: string
              validations:
                max_length: 200
            description:
              type: string
              validations:
                max_length: 300
            icon:
              type: string
              validations:
                max_length: 100
            presentation:
              type: enum
              default: icon_and_label
              choices:
                - icon_and_label
                - label_only
                - icon_only
            device_visibility:
              type: enum
              default: both
              choices:
                - both
                - desktop
                - mobile
            target:
              type: enum
              default: _self
              choices:
                - _self
                - _blank
            visibility:
              type: enum
              default: everyone
              choices:
                - everyone
                - anonymous
                - authenticated

custom_font_awesome_icons:
  type: list
  list_type: simple
  default: "comments|book-open|circle-info|globe|user-plus|user-gear"
