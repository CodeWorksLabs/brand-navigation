name: Discourse Theme

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    if: ${{ !startsWith(github.base_ref, 'd-compat/') }}
    uses: discourse/.github/.github/workflows/discourse-theme.yml@05b8c4ee75d2408ffd23a2fbfb948dd82037fc57 # v1

  ci-2026-7-esr:
    if: ${{ !startsWith(github.base_ref, 'd-compat/') }}
    uses: discourse/.github/.github/workflows/discourse-theme.yml@05b8c4ee75d2408ffd23a2fbfb948dd82037fc57 # v1
    with:
      core_ref: 8a4ea10470790eba93f5dec65f3cacb0ffae1191 # v2026.7.3
      skip_linting: true

  ci-2026-9-release:
    if: ${{ !startsWith(github.base_ref, 'd-compat/') }}
    uses: discourse/.github/.github/workflows/discourse-theme.yml@05b8c4ee75d2408ffd23a2fbfb948dd82037fc57 # v1
    with:
      core_ref: 343b20f97ef5f6bd70826ee0e993ba348b210fd5 # v2026.9.0
      skip_linting: true

  ci-2026-8-release:
    if: ${{ !startsWith(github.base_ref, 'd-compat/') }}
    uses: discourse/.github/.github/workflows/discourse-theme.yml@05b8c4ee75d2408ffd23a2fbfb948dd82037fc57 # v1
    with:
      core_ref: 1dce604a018931ff85572ce9815f7637e843f08c # v2026.8.1
      skip_linting: true

  ci-compatibility-branch:
    if: ${{ startsWith(github.base_ref, 'd-compat/') }}
    uses: discourse/.github/.github/workflows/discourse-theme.yml@05b8c4ee75d2408ffd23a2fbfb948dd82037fc57 # v1
