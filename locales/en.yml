      header_text_hover: "Discourse header — link text on hover/focus"
      header_hover_background: "Discourse header — link and icon background on hover/focus"
  theme_metadata:
    description: "A brand header and submenu navigation theme component for Discourse."
    settings:
      outlet: "Place the bar above or below the core site header."
      show_brand: "Show the configured brand identity."
      brand_name: "Accessible brand name and optional visible text."
      brand_url: "Destination for the brand identity."
      brand_logo: "Logo used in light color palettes."
      brand_logo_dark: "Optional logo used in dark color palettes."
      brand_presentation: "Show the logo, name, or both."
      brand_target: "Open the brand destination in the same or a new browsing context."
      mobile_mode: "Use a compact header menu, a full bar, or no brand navigation on mobile."
      bar_background_color: "Navigation bar background. Enter a hex color here (e.g. #002147), or use the picker in Appearance. Leave blank for the theme color."
      bar_text_color: "Navigation bar text and icons. Enter a hex color here (e.g. #002147), or use the picker in Appearance. Leave blank for the theme color."
      hover_background_color: "Navigation menu background on hover, keyboard focus or active highlight. Enter a hex color here (e.g. #002147), or use the picker in Appearance. Leave blank for the theme color."
      submenu_background_color: "Dropdown menu background. Enter a hex color here (e.g. #002147), or use the picker in Appearance. Leave blank for the theme color."
      submenu_text_color: "Dropdown menu text and icons. Enter a hex color here (e.g. #002147), or use the picker in Appearance. Leave blank for the theme color."
      submenu_hover_text_color: "Dropdown text and icons on hover or keyboard focus. Enter a hex color here (e.g. #FFFFFF), or use the picker in Appearance. Leave blank to use the normal dropdown text color."
      header_icon_color: "Brand Navigation's icons in the Discourse header. Enter a hex color here (e.g. #002147), or use the picker in Appearance. Leave blank for the theme color."
      header_icon_hover_color: "Brand Navigation's header icons on hover or keyboard focus. Enter a hex color here (e.g. #002147), or use the picker in Appearance. Leave blank for the theme's icon hover color."
      header_text_color: "Brand Navigation's link text in the Discourse header. Enter a hex color here (e.g. #002147), or use the picker in Appearance. Leave blank for the theme's header text color."
      header_text_hover_color: "Brand Navigation's header link text on hover or keyboard focus. Enter a hex color here (e.g. #002147), or use the picker in Appearance. Leave blank for the theme's header text color."
      header_hover_background_color: "Background behind Brand Navigation's header links and icons on hover or keyboard focus. Enter a hex color here (e.g. #002147), or use the picker in Appearance. Leave blank for the default background."
      header_icon_size_desktop: "Size of icons added by Brand Navigation to the main Discourse header (the area with your forum logo and login/profile controls), in desktop view. Enter 0 to keep the theme's default size, or a whole number from 1 to 48 for the size in pixels; for example, 20 means 20px. Does not resize link text, icons in the separate navigation bar, or Discourse's own controls. Mobile icon size is set separately."
      header_icon_size_mobile: "Size of icons added by Brand Navigation to the main Discourse header, in Discourse's mobile view. Enter 0 to keep the theme's default size, or a whole number from 1 to 48 for the size in pixels; for example, 20 means 20px. This is independent of desktop icon size and does not resize link text, icons in the separate navigation bar, or Discourse's own controls. A narrow desktop window alone does not select the mobile setting."
      header_text_size_desktop: "Size of link text added by Brand Navigation to the main Discourse header (the area with your forum logo and login/profile controls), in desktop view. Enter 0 to keep the theme's default size, or a whole number from 1 to 48 for the size in pixels; for example, 16 means 16px. Does not resize icons, text in the separate navigation bar, or Discourse's own controls. Mobile link-text size is set separately."
      header_text_size_mobile: "Size of link text added by Brand Navigation to the main Discourse header, in Discourse's mobile view. Enter 0 to keep the theme's default size, or a whole number from 1 to 48 for the size in pixels; for example, 16 means 16px. This is independent of desktop link-text size and does not resize icons, text in the separate navigation bar, or Discourse's own controls. A narrow desktop window alone does not select the mobile setting."
      navigation_items:
        description: "Ordered top-level links and one-level submenus."
        schema:
          properties:
            label:
              label: "Label"
              description: "Visible top-level navigation text."
            url:
              label: "URL"
              description: "Makes the label a link. With children, a separate caret opens the submenu."
            link_mode:
              label: "Top-level behavior"
              description: "Use Link to make the label navigate, or Submenu group to make the label open only its submenu."
            title:
              label: "Tooltip"
              description: "Optional additional context exposed on hover."
            icon:
              label: "Icon"
              description: "Optional Font Awesome 6 icon name."
            presentation:
              label: "Presentation"
              description: "For bar items, show the icon and label, label only, or icon only."
            section:
              label: "Section"
              description: "For brand-bar items only, keep this item beside the brand or align it to the far edge. Use Site-header alignment for core-header links."
            surface:
              label: "Surface"
              description: "Default: Brand Navigation bar (bar). A blank value also uses the bar. Choose site_header for Discourse's own header; a URL is required and submenu items are not allowed."
            header_presentation:
              label: "Site-header presentation"
              description: "For site-header items, show icon only (the existing default), label only, or icon and label. Icon-only links require an icon; text links can omit it."
            header_alignment:
              label: "Site-header alignment"
              description: "For site-header items, place the link beside the logo (left) or before the header controls (right, the default). Links and icons always precede Sign Up and Log In. Left and right follow the reading direction in RTL layouts."
            device_visibility:
              label: "Device visibility"
              description: "Show on both device classes, desktop/tablet only, or mobile phones only. Rotation does not change the device class. Existing blank values behave as both."
            target:
              label: "Target"
              description: "Open this link in the same tab (_self) or a new tab (_blank). Save changes, then refresh the forum page to load the updated navigation."
            visibility:
              label: "Audience"
            children:
              label: "Submenu items"
              description: "Ordered child links; arbitrary deep nesting is intentionally unsupported."
              schema:
                properties:
                  label:
                    label: "Label"
                  url:
                    label: "URL"
                  title:
                    label: "Tooltip"
                  description:
                    label: "Visible description"
                    description: "Optional secondary text displayed below the submenu label."
                  icon:
                    label: "Icon"
                  presentation:
                    label: "Presentation"
                  device_visibility:
                    label: "Device visibility"
                    description: "Show on both device classes, desktop/tablet only, or mobile phones only. Rotation does not change the device class. Existing blank values behave as both."
                  target:
                    label: "Target"
                  visibility:
                    label: "Audience"
      custom_font_awesome_icons: "Font Awesome 6 icon names used by navigation entries."
