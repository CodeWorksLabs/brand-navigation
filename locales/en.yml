  theme_metadata:
    description: "A brand header and submenu navigation theme component for Discourse."
    settings:
      outlet: "Place the bar above or below the core site header."
      show_brand: "Show the configured brand identity."
      brand_name: "Accessible brand name and optional visible text."
      brand_url: "Destination for the brand identity."
      brand_logo: "Logo used in light color palettes."
      brand_logo_dark: "Optional logo used in dark color palettes."
      brand_presentation: "Show the logo, name, or both."
      brand_target: "Open the brand destination in the same or a new browsing context."
      mobile_mode: "Use a compact header menu, a full bar, or no brand navigation on mobile."
      bar_background_color: "Optional six-digit hex override for the bar background. A leading # is optional. Leave blank to inherit --tertiary."
      bar_text_color: "Optional six-digit hex override for bar text and icons. A leading # is optional. Leave blank to inherit --secondary."
      hover_background_color: "Optional six-digit hex override for hover and active highlights. A leading # is optional. Leave blank to inherit --quaternary-low."
      submenu_background_color: "Optional six-digit hex override for submenu backgrounds. A leading # is optional. Leave blank to inherit --secondary."
      submenu_text_color: "Optional six-digit hex override for submenu text and icons. A leading # is optional. Leave blank to inherit --primary."
      header_icon_color: "Optional six-digit hex override for Brand Navigation core-header icons only. A leading # is optional. Leave blank to inherit the theme's --d-header-icon-color. Does not change link text or Discourse's own icons."
      header_icon_hover_color: "Optional six-digit hex override for Brand Navigation core-header icons on hover and keyboard focus. A leading # is optional. Leave blank to inherit the theme's --d-header-icon-color--hover."
      navigation_items:
        description: "Ordered top-level links and one-level submenus."
        schema:
          properties:
            label:
              label: "Label"
              description: "Visible top-level navigation text."
            url:
              label: "URL"
              description: "Makes the label a link. With children, a separate caret opens the submenu."
            link_mode:
              label: "Top-level behavior"
              description: "Use Link to make the label navigate, or Submenu group to make the label open only its submenu."
            title:
              label: "Tooltip"
              description: "Optional additional context exposed on hover."
            icon:
              label: "Icon"
              description: "Optional Font Awesome 6 icon name."
            presentation:
              label: "Presentation"
              description: "For bar items, show the icon and label, label only, or icon only."
            section:
              label: "Section"
              description: "For brand-bar items only, keep this item beside the brand or align it to the far edge. Use Site-header alignment for core-header links."
            surface:
              label: "Surface"
              description: "Show this item in the Brand Navigation bar or as a direct link in the Discourse site header. Site-header items require a URL and cannot contain children."
            header_presentation:
              label: "Site-header presentation"
              description: "For site-header items, show icon only (the existing default), label only, or icon and label. Icon-only links require an icon; text links can omit it."
            header_alignment:
              label: "Site-header alignment"
              description: "For site-header items, place the link beside the logo (left) or before the header controls (right, the default). Links and icons always precede Sign Up and Log In. Left and right follow the reading direction in RTL layouts."
            device_visibility:
              label: "Device visibility"
              description: "Show on both device classes, desktop/tablet only, or mobile phones only. Rotation does not change the device class. Existing blank values behave as both."
            target:
              label: "Target"
              description: "Open this link in the same tab (_self) or a new tab (_blank). Save changes, then refresh the forum page to load the updated navigation."
            visibility:
              label: "Audience"
            children:
              label: "Submenu items"
              description: "Ordered child links; arbitrary deep nesting is intentionally unsupported."
              schema:
                properties:
                  label:
                    label: "Label"
                  url:
                    label: "URL"
                  title:
                    label: "Tooltip"
                  description:
                    label: "Visible description"
                    description: "Optional secondary text displayed below the submenu label."
                  icon:
                    label: "Icon"
                  presentation:
                    label: "Presentation"
                  device_visibility:
                    label: "Device visibility"
                    description: "Show on both device classes, desktop/tablet only, or mobile phones only. Rotation does not change the device class. Existing blank values behave as both."
                  target:
                    label: "Target"
                  visibility:
                    label: "Audience"
